name: Workspace Validator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-validator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  platforms:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - name: Test all targets
        run: cargo test --all-targets --locked
      - name: Test Rustdoc examples
        run: cargo test --doc --locked

  quality:
    name: Formatting, Clippy, and Rustdoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build warning-free Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings -D missing-docs
        run: cargo doc --no-deps --locked

  msrv:
    name: Rust 1.87
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.87
        run: rustup toolchain install 1.87.0 --profile minimal --no-self-update
      - name: Install Windows target for Rust 1.87
        run: rustup target add --toolchain 1.87.0 x86_64-pc-windows-gnu
      - name: Check all targets
        run: cargo +1.87.0 check --all-targets --locked
      - name: Check Windows target with Rust 1.87
        run: cargo +1.87.0 check --all-targets --locked --target x86_64-pc-windows-gnu
      - name: Test all targets
        run: cargo +1.87.0 test --all-targets --locked
      - name: Test Rustdoc examples
        run: cargo +1.87.0 test --doc --locked

  security:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - name: Install audit tools
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
      - name: Audit dependency lockfile
        run: cargo audit --file Cargo.lock
      - name: Check crate licenses and sources
        run: cargo deny --config deny.toml check bans licenses sources

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - name: List package contents
        run: cargo package --list --locked
      - name: Build isolated package
        run: cargo package --locked
      - name: Install and smoke-test packaged CLI
        shell: bash
        run: |
          package_dir="target/package/workspace-validator-0.1.0"
          install_root="$RUNNER_TEMP/workspace-validator-install"
          smoke_dir="$RUNNER_TEMP/workspace-validator-smoke"
          binary="$install_root/bin/workspace-validator"

          cargo install --path "$package_dir" --root "$install_root" --locked
          mkdir -p "$smoke_dir"
          cat > "$smoke_dir/config.json" <<'JSON'
          {
            "schemaVersion": 6,
            "workspaceRoot": ".",
            "defaultGroup": "all",
            "outputLimitBytes": 4096,
            "tools": [
              {
                "id": "rustc",
                "program": "rustc",
                "requiresTools": [],
                "versionArgs": ["--version"],
                "versionParser": "firstSemver",
                "versionRequirement": ">=1.87"
              }
            ],
            "checks": [
              {
                "id": "rust.version",
                "label": "Rust version",
                "description": "Reads the active Rust compiler version.",
                "toolId": "rustc",
                "args": ["--version"],
                "requiresTools": [],
                "timeoutSeconds": 30
              }
            ],
            "suites": [
              {
                "id": "rust",
                "label": "Rust",
                "description": "Validates the Rust compiler.",
                "checks": [
                  {
                    "checkId": "rust.version",
                    "dependsOn": []
                  }
                ]
              }
            ],
            "groups": [
              {
                "id": "all",
                "label": "All validations",
                "description": "Runs every validation.",
                "members": [
                  { "kind": "suite", "id": "rust" }
                ]
              }
            ]
          }
          JSON

          "$binary" --version
          "$binary" --help > /dev/null
          "$binary" schema config > /dev/null
          "$binary" schema report > /dev/null
          "$binary" config validate --config "$smoke_dir/config.json"
      - name: Record package size
        shell: bash
        run: |
          archive="target/package/workspace-validator-0.1.0.crate"
          test -f "$archive"
          du -h "$archive"
